name: React CI Pipeline

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Node version
        run: node -v

      - name: Show npm version
        run: npm -v

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build