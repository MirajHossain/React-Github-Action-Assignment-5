name: React CI Pipeline

on:
  push:
    branches:
      - development

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Node
        run: node -v

      - name: Verify npm
        run: npm -v

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build